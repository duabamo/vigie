# Configuration à préparer pour un environnement équipé de Docker Compose v2.
# Aucun téléchargement n'est effectué tant que ces commandes ne sont pas lancées.
name: vigie

services:
  volume-init:
    image: apache/spark:3.5.3-python3
    user: "0:0"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        mkdir -p /state/checkpoints /state/ivy /state/kafka
        chown -R 185:0 /state/checkpoints /state/ivy
        chown -R 1000:1000 /state/kafka
    volumes:
      - checkpoints:/state/checkpoints
      - ivy-cache:/state/ivy
      - kafka-data:/state/kafka
    restart: "no"

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    depends_on:
      volume-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks: [fraud-network]

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/project/scripts/init-topics.sh"]
    volumes:
      - ./scripts/init-topics.sh:/opt/project/scripts/init-topics.sh:ro
    networks: [fraud-network]
    restart: "no"

  cassandra:
    image: cassandra:4.1.7
    hostname: cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: Vigie
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 192M
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE CLUSTER' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [fraud-network]

  cassandra-init:
    image: cassandra:4.1.7
    depends_on:
      cassandra:
        condition: service_healthy
    entrypoint: ["cqlsh", "cassandra", "-f", "/opt/schema.cql"]
    volumes:
      - ./schema.cql:/opt/schema.cql:ro
    networks: [fraud-network]
    restart: "no"

  spark-master:
    image: apache/spark:3.5.3-python3
    hostname: spark-master
    user: "185:0"
    depends_on:
      volume-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      SPARK_NO_DAEMONIZE: "1"
      SPARK_LOCAL_IP: spark-master
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CASSANDRA_HOST: cassandra
      CHECKPOINT_DIR: /opt/spark/checkpoints
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:4040:4040"
    volumes:
      - .:/opt/project:ro
      - checkpoints:/opt/spark/checkpoints
      - ivy-cache:/opt/spark/ivy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://spark-master:8080/json/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [fraud-network]

  spark-worker:
    image: apache/spark:3.5.3-python3
    user: "185:0"
    depends_on:
      spark-master:
        condition: service_healthy
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "2", "--memory", "2g", "--webui-port", "8081", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "1"
      PYSPARK_PYTHON: python3
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - .:/opt/project:ro
      - checkpoints:/opt/spark/checkpoints
    networks: [fraud-network]

networks:
  fraud-network:
    driver: bridge

volumes:
  kafka-data:
  cassandra-data:
  checkpoints:
  ivy-cache:
